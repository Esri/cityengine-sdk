<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <title>sqrt function</title>
    <link rel="stylesheet" href="../cgareference_style.css" type="text/css">
</head>

<body>
<article class="content">

    <header class="section">
        <h1>
            <span class="name">sqrt</span>
            <span class="kind">function</span>
        </h1>

        <div class="signatures">
            <div><span class="type-tag">float</span> <span class="func">sqrt</span>(<span class="param">x</span>)</div>
        </div>
    </header>

    <section class="section">
        <div class="param-list">
            <div class="param-item">
                <div class="indent-body">
                    <p><span class="param">x</span> <span class="type-tag">float</span></p>
                </div>
            </div>
        </div>
    </section>

    <section class="section">
        <div class="return-list">
            <div class="return-item">
                <div class="indent-body">
                        <p>Returns the non-negative square root of <span class="param">x</span>. If <span class="param">x</span> is negative, <span class="inlinecode">nan</span> is generated.</p>
                </div>
            </div>
        </div>
    </section>

    <section class="section">
        <p>The <span class="func">sqrt</span> function calculates the square root of <span class="param">x</span>.</p>
    </section>

</article>
</body>
</html>
